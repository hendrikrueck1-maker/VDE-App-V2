<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#003366">
<link rel="icon" type="image/png" sizes="32x32" href="icons/app/favicon-32.png">
<link rel="apple-touch-icon" href="icons/app/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VDE Prüfung">
<title>Master-Feldbibliothek – VDE Prüf App</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/felder.css">
<link rel="stylesheet" href="css/masterbibliothek.css">
<link rel="stylesheet" href="css/erklaerungen.css">
</head>
<body>

<div class="topbar">
  <div class="topbar-row1">
    <div><a href="index.html" class="mb-zurueck">← Hauptseite</a> <strong>Master-Feldbibliothek</strong><span class="sub">Alle Felder mit ID, Legende und Hilfen</span></div>
    <div class="toggle-wrap">Warum &amp; Wie
      <span class="ios-toggle"><input type="checkbox" id="toggleInfokarten" checked><span class="track" onclick="document.getElementById('toggleInfokarten').click()"></span></span>
    </div>
  </div>
  <div class="toolbar-row2">
    <input type="text" id="suche" placeholder="Filter: ID oder Feldname eingeben, z. B. STAM-08 oder Prüfintervall">
    <div class="chips" id="chipbar"></div>
  </div>
</div>

<div class="legend">
  <span><span class="dot" style="background:var(--warn-border)"></span>Pflicht</span>
  <span><span class="dot" style="background:#94a3b8"></span>Optional</span>
  <span><span class="dot" style="background:#3730a3"></span>Bedingt</span>
  <span><span class="dot" style="background:var(--danger-border)"></span>Kritisch / niemals vorbelegt</span>
</div>
<div class="count-info" id="count-info"></div>

<div class="feldliste" id="feldliste"></div>

<script src="js/felder-daten.js"></script>
<script src="js/icons.js"></script>
<script src="js/erklaerungen-daten.js"></script>
<script src="js/erklaerungen.js"></script>
<script src="js/app-config.js"></script>
<script src="js/feld-renderer.js"></script>
<script src="js/feld-logik.js"></script>
<script src="js/masterbibliothek.js"></script>
</body>
</html>
